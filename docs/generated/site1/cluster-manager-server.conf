# server.conf on cluster manager at site1
[general]
site = site1

[clustering]
mode = manager
multisite = true
available_sites = site1,site2
site_replication_factor = origin:2,site1:2,site2:2,total:4
site_search_factor = origin:1,site1:1,site2:1,total:2
cluster_label = idxc1
pass4SymmKey = <set from your secrets store>
forwarder_site_failover = site1:site2,site2:site1
manager_switchover_mode = manual
manager_uri = clustermanager:site1,clustermanager:site2

[clustermanager:site1]
manager_uri = https://cm-site1.example.internal:8089

[clustermanager:site2]
manager_uri = https://cm-site2.example.internal:8089

[indexer_discovery]
pass4SymmKey = <set from your secrets store>
indexerWeightByDiskCapacity = true
