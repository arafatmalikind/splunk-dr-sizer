# server.conf on search head cluster members at site1
[general]
# site0 disables search affinity so every member uses the same primary copies,
# as recommended for search head clusters that span sites
site = site0

[clustering]
mode = searchhead
multisite = true
manager_uri = https://cluster-manager.example.internal:8089   # load balancer or DNS name in front of the managers
pass4SymmKey = <set from your secrets store>
